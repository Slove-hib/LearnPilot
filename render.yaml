# Render 部署配置（免费版）
# 注意：免费版文件系统不持久化，每次重新部署 SQLite 数据会丢失
# 如需持久化，升级付费计划并添加 disk 配置
services:
  - type: web
    name: learnpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: MIMO_API_KEY
        sync: false
      - key: MIMO_MODEL
        value: mimo-v2.5-pro
      - key: MIMO_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: learnpilot.db
      - key: CORS_ORIGINS
        sync: false
