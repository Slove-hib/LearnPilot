services:
  backend:
    build: ./backend
    container_name: learnpilot-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_PATH=/data/learnpilot.db
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: learnpilot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
